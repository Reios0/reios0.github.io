media:
  input: assets/images
  output: /assets/images

content:
  - name: skills
    label: Skills
    type: collection
    path: _skills
    filename: '{fields.name}.md'
    fields:
      - name: name
        label: Name
        type: string
      - name: icon
        label: Icon
        type: image
      - name: category
        label: Category
        type: select
        options:
          values: [Frontend, Backend, DevOps, Tools]
  
  - name: projects
    label: Projects
    type: collection
    path: _projects
    filename: '{fields.title}.md'
    view:
      fields: [title, description, date]
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      - name: date
        label: Date
        type: date
      - name: skills
        label: Skills
        type: reference
        options:
          collection: skills
          multiple: true
          value: '{fields.name}'
          label: '{fields.name}'
      - name: link
        label: Link
        type: string
      - name: screenshot
        label: Screenshot
        type: image
      - name: body
        label: Body
        type: rich-text
  
  - name: config
    label: Site settings
    type: file
    path: _config.yml
    fields:
      - name: title
        label: Site title
        type: string
      - name: description
        label: Site description
        type: string
      - name: url
        label: Site url
        type: string
