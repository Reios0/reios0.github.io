<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <script>
      (function () {
        let stored = localStorage.getItem('theme');
        let systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (systemDark ? 'dark' : 'light'));
      })();
    </script>
    <title>{{ page.title }} | {{ site.data.settings.title }}</title>
    <meta name="description" content="{{ page.description | default: site.data.settings.description }}">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="/assets/css/main.css">
  </head>
  <body>
    {% include nav.html %}
    <main id="main-content" tabindex="-1">
        {{ content }}
    </main>
    {% include footer.html %}
    <script src="/assets/js/main.js"></script>
  </body>
</html>
