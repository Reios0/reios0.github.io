<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.data.settings.title }}</title>
    <meta name="description" content="{{ page.description | default: site.data.settings.description }}">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="/assets/css/main.css">
  </head>
  <body>
    {% include nav.html %}
    <main id="main-content" tabindex="-1">

    </main>
    {% include footer.html %}
    <script src="/assets/js/main.js"></script>
  </body>
</html>
